# Demo complete : `docker compose up --build` puis http://localhost:8090
# Dev local     : `docker compose up -d db` puis `npm run dev` (voir README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      # 5437 sur l'hote : 5432/5433 sont pris par des PostgreSQL natifs, 5434 a 5436 par d'autres projets.
      - "5437:5432"
    volumes:
      - chat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/chat
      DB_USER: chat
      DB_PASSWORD: chat
      ALLOWED_ORIGINS: http://localhost:*
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 24

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chat-db:
