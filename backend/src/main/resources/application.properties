spring.application.name=chat

server.port=${PORT:8083}

# PostgreSQL via docker-compose (voir docker-compose.yml a la racine du depot).
# En dev : `docker compose up -d db` puis demarrer le backend. Identifiants de dev uniquement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/chat}
spring.datasource.username=${DB_USER:chat}
spring.datasource.password=${DB_PASSWORD:chat}

# Schema gere par Flyway (src/main/resources/db/migration) ; Hibernate verifie seulement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Origines autorisees a ouvrir le WebSocket /ws (motifs separes par des virgules).
relais.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}
# Bots de demonstration (ada, grace, linus) : accueil des nouveaux et reponses aux mentions.
relais.demo-bots=${DEMO_BOTS:true}
