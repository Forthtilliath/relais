server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API Spring Boot (service docker-compose "backend")
  location /api/ {
    proxy_pass http://backend:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket STOMP : mise a niveau HTTP/1.1 -> WebSocket, connexion longue (battements de coeur toutes les 10 s)
  location /ws {
    proxy_pass http://backend:8083;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Fichiers fingerprintes par le build Angular : cache long
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Routes du SPA (/connexion, /c/...) : toujours index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
